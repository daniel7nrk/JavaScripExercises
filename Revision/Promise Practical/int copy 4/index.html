<!DOCTYPE html>
<html>
<head><title>Weather XHR Test</title></head>
<body>
  <script>
    function fetchWeather(city) {
      const API_KEY = "5d7cf6594bfd574078da8d5081c3df26";
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

      const xhr = new XMLHttpRequest();
      xhr.open('GET', url);

      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          const data = JSON.parse(xhr.responseText);
          console.log('Weather data:', data);
        } else {
          const errorData = JSON.parse(xhr.responseText);
          console.error(`Request failed (${xhr.status}):`, errorData.message);
        }
      };

      xhr.onerror = function () {
        console.error('Network error occurred while fetching weather data.');
      };

      xhr.send();
    }

    // fetchWeather('notarealcityxyz');
    fetchWeather('kigali');
  </script>
</body>
</html>
